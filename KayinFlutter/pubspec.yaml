name: kayin_flutter
description: "Kayın Tarım — Offline-First Tarım Yönetim Uygulaması"
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1

  # ── Yerel Veritabanı ─────────────────────────────────────────────────
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0

  # ── HTTP / Network ────────────────────────────────────────────────────
  dio: ^5.4.3
  connectivity_plus: ^6.0.3

  # ── Harita ───────────────────────────────────────────────────────────
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # ── AI / TFLite ───────────────────────────────────────────────────────
  tflite_flutter: ^0.12.1

  # ── Kamera ───────────────────────────────────────────────────────────
  image_picker: ^1.1.2
  path_provider: ^2.1.6 # tarama fotoğrafları kalıcı klasöre kopyalanır

  # ── UUID (client-side Guid üretimi) ──────────────────────────────────
  uuid: ^4.4.0

  # ── UI Yardımcıları ───────────────────────────────────────────────────
  intl: ^0.20.2

  # ── Oturum (token cihazın güvenli deposunda) ─────────────────────────
  flutter_secure_storage: ^11.2.0
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_localizations:
    sdk: flutter
  workmanager: ^0.10.10
  google_mlkit_text_recognition: ^0.17.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
